<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Славком — вход по паролю (новая версия)</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;font:14px system-ui,sans-serif}header{height:54px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14283c;color:white;box-sizing:border-box}header b{margin-right:auto}button,input{border:1px solid #bac4d0;border-radius:6px;padding:8px;font:inherit}button{cursor:pointer}#map{height:calc(100dvh - 54px)}#login,#detail{position:absolute;z-index:1100;background:#fff;padding:16px;border-radius:10px;box-shadow:0 3px 20px #0004;box-sizing:border-box}#login{top:64px;left:10px;max-width:340px}#login input{display:block;margin:8px 0;width:95%}#detail{top:64px;right:10px;bottom:12px;width:min(390px,94vw);overflow:auto;display:none}#status{font-size:11px}small{color:#64748b}p{overflow-wrap:anywhere}#message{font-size:12px;color:#475569}.row{border-bottom:1px solid #e2e8f0;padding:8px 0}</style></head><body><header><b>Славком · карта</b><span id="status">Вход</span><button onclick="load()">↻</button><button onclick="logout()">Выход</button></header><div id="map"></div><section id="login"><b>Доступ к карте сети</b><p>Вход по почте и паролю. Письмо с кодом или ссылкой — резервный вариант. Просмотр доступен только разрешённым пользователям.</p><input type="email" id="email" placeholder="Электронная почта"><input type="password" id="password" autocomplete="current-password" placeholder="Пароль"><button onclick="passwordLogin()">Войти по паролю</button><p><small>Если пароль ещё не задан, его нужно установить в Supabase. Вход по письму оставлен как резервный вариант.</small></p><button onclick="sendCode()">Получить письмо для входа</button><input id="code" placeholder="Код из письма"><button onclick="verifyCode()">Войти</button><p id="message"></p></section><aside id="detail"><button style="float:right" onclick="document.getElementById('detail').style.display='none'">Закрыть</button><div id="content"></div></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient('https://xwnqquregcurkxrbmavy.supabase.co','sb_publishable_YiKgXPhiGP9CuiMBBBo48Q_NU54IRES');
const map=L.map('map').setView([43.424107,39.954174],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);let db=null;
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=x=>document.getElementById('message').textContent=x;
async function passwordLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value; if(!email||!password){msg('Введите почту и пароль');return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg(error.message);return}msg('Вход выполнен');load()}
async function sendCode(){const {error}=await sb.auth.signInWithOtp({email:document.getElementById('email').value.trim(),options:{emailRedirectTo:'https://arbitr-slavcom.github.io/Slavcom-map/'}});msg(error?.message||'Письмо отправлено. Откройте ссылку «Войти» в письме. Если ссылка не открывает карту, нужно разрешить адрес карты в настройках Supabase Auth.')}
async function verifyCode(){const {error}=await sb.auth.verifyOtp({email:document.getElementById('email').value.trim(),token:document.getElementById('code').value.trim(),type:'email'});msg(error?.message||'Вход выполнен');if(!error)load()}
async function logout(){await sb.auth.signOut();layer.clearLayers();db=null;document.getElementById('login').style.display='block';document.getElementById('status').textContent='Вход'}
let selectedClosure=null;
function fiberColor(v){const t=String(v||'').toLowerCase();if(t.includes('крас')||t.includes('red'))return '#dc2626';if(t.includes('сирен')||t.includes('фиолет')||t.includes('purple')||t.includes('violet'))return '#9333ea';if(t.includes('жёл')||t.includes('желт')||t.includes('yellow'))return '#eab308';if(t.includes('сер')||t.includes('gray')||t.includes('grey'))return '#64748b';if(t.includes('корич')||t.includes('brown'))return '#92400e';if(t.includes('оранж')||t.includes('orange'))return '#f97316';if(t.includes('син')||t.includes('blue'))return '#2563eb';if(t.includes('зел')||t.includes('green'))return '#16a34a';if(t.includes('бел')||t.includes('white'))return '#cbd5e1';if(t.includes('чёр')||t.includes('черн')||t.includes('black'))return '#111827';return '#64748b'}
function wholeClosureDiagram(c){
const versions=(db.schemes||[]).filter(x=>x.closure_id===c.id).sort((a,b)=>b.version_number-a.version_number),v=versions[0]?.scheme||{},central=c.code==='GARAZHI-CENTRAL';
const joins=[...(v.olt_to_forest||[]).map(x=>({from:'OLT · '+x.olt,to:'ЛЕС · '+x.forest,a:fiberColor(x.olt),b:fiberColor(x.forest),splice:true})),...(v.other_connections||[]).filter(x=>!central||!String(x.olt).toLowerCase().includes('зел')).map(x=>({from:'OLT · '+x.olt,to:x.destination,a:fiberColor(x.olt),b:'#94a3b8',splice:false}))];
const splices=db.splices.filter(x=>x.closure_id===c.id);if(!joins.length&&!central)splices.forEach(x=>{const a=db.cables.find(z=>z.id===x.input_cable_id),b=db.cables.find(z=>z.id===x.output_cable_id);joins.push({from:(a?.code||'Кабель?')+' №'+x.input_fiber,to:(b?.code||'Кабель?')+' №'+x.output_fiber,a:'#64748b',b:'#64748b',splice:true})});
const n=joins.length,plcY=100+n*62+45,height=central?plcY+265:100+n*62;
let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 '+height+'" role="img" aria-label="Схема муфты" style="display:block;width:100%;min-width:720px;height:auto;font-family:system-ui,sans-serif"><rect x="3" y="3" width="834" height="'+(height-6)+'" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="420" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">'+e(c.name)+'</text><text x="22" y="62" font-size="13" fill="#334155">Входящие волокна</text><text x="570" y="62" font-size="13" fill="#334155">Выходящие кабели</text>';
joins.forEach((x,i)=>{const y=88+i*62;svg+='<rect x="14" y="'+(y-19)+'" width="230" height="40" rx="6" fill="white" stroke="#cbd5e1"/><text x="25" y="'+(y+6)+'" font-size="14" fill="#0f172a">'+e(x.from)+'</text><line x1="244" y1="'+y+'" x2="410" y2="'+y+'" stroke="'+x.a+'" stroke-width="5"/><circle cx="420" cy="'+y+'" r="8" fill="white" stroke="'+(x.splice?'#ea580c':'#2563eb')+'" stroke-width="3"/><line x1="430" y1="'+y+'" x2="565" y2="'+y+'" stroke="'+x.b+'" stroke-width="5"/><rect x="565" y="'+(y-19)+'" width="260" height="40" rx="6" fill="white" stroke="#cbd5e1"/><text x="576" y="'+(y+6)+'" font-size="12" fill="#0f172a">'+e(x.to.length>37?x.to.slice(0,35)+'…':x.to)+'</text>'});
if(central){const y=plcY;svg+='<text x="20" y="'+(y-37)+'" font-size="16" font-weight="700" fill="#0f172a">PLC 1×4 · один делитель</text><rect x="14" y="'+(y-17)+'" width="220" height="40" rx="6" fill="white" stroke="#cbd5e1"/><text x="25" y="'+(y+8)+'" font-size="14" fill="#0f172a">OLT · зелёный</text><line x1="234" y1="'+(y+3)+'" x2="343" y2="'+(y+3)+'" stroke="#16a34a" stroke-width="5"/><rect x="343" y="'+(y-22)+'" width="115" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="'+(y+9)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PLC 1×4</text>';
const outs=[['Красный → Слава · PLC 1×16','#dc2626'],['Кабель №2 → абонентская №1','#64748b'],['Свободный выход','#a1a1aa'],['Синий → кабель неизвестен','#2563eb']];
outs.forEach(([name,color],i)=>{const yy=y-9+i*57;svg+='<path d="M458 '+(y+3)+' H485 V'+yy+' H565" fill="none" stroke="'+color+'" stroke-width="5"'+(i===2?' stroke-dasharray="8 6"':'')+'/><rect x="565" y="'+(yy-19)+'" width="260" height="40" rx="6" fill="white" stroke="#cbd5e1"/><text x="575" y="'+(yy+6)+'" font-size="12" fill="#0f172a">'+e(name)+'</text>'})}
svg+='</svg>';return '<h4>Общая схема муфты</h4><div style="overflow-x:auto;max-width:100%;border:1px solid #cbd5e1;border-radius:10px">'+svg+'</div><p><small>Сварки отмечены оранжевым кольцом. PLC 1×4 изображён одним устройством; физические номера выходов неизвестны. Схема условная, с горизонтальной прокруткой.</small></p>'
}
function scheme(c){const splitters=db.splitters.filter(x=>x.closure_id===c.id),splices=db.splices.filter(x=>x.closure_id===c.id);let h=wholeClosureDiagram(c)+'<p><small>Ниже — подробности делителей, волокон и сварок из Supabase.</small></p>';
splitters.forEach(s=>{if(c.code==='GARAZHI-CENTRAL')return;const outputs=db.outputs.filter(o=>o.splitter_id===s.id);h+='<div class="row"><b>'+e(s.code)+' · 1×'+e(s.ratio)+'</b><p>'+e(s.input_description||'Вход не уточнён')+'</p><svg viewBox="0 0 320 80" style="width:100%;max-width:400px" role="img" aria-label="Делитель с входным и выходными волокнами"><line x1="10" y1="40" x2="105" y2="40" stroke="#16a34a" stroke-width="4"/><rect x="105" y="20" width="95" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="152" y="45" font-size="14" text-anchor="middle" fill="#1e3a8a">PLC 1×'+e(s.ratio)+'</text>';outputs.slice(0,4).forEach((o,i)=>{const y=12+i*18;h+='<path d="M200 40 H220 V'+y+' H310" fill="none" stroke="'+fiberColor(o.fiber_color)+'" stroke-width="3"/>'});h+='</svg>';outputs.forEach(o=>{const cable=db.cables.find(x=>x.id===o.cable_id);h+='<div class="row"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+fiberColor(o.fiber_color)+'"></span> '+e(o.fiber_color||'Цвет не указан')+' → '+e(cable?.code||'Кабель не указан')+' · порт '+e(o.output_port||'не установлен')+'<p><small>'+e(o.notes||'')+'</small></p></div>'});if(s.notes)h+='<p>'+e(s.notes)+'</p>';h+='</div>'});
if(c.code==='GARAZHI-CENTRAL'){h+='<h4>Все четыре выхода PLC 1×4</h4><div class="row">🔴 Красное волокно → GAR-CENTRAL-SLAVA-8F → муфта Славы → PLC 1×16</div><div class="row">⚪ Кабель №2, 1F → абонентская муфта №1; цвет волокна не установлен</div><div class="row">○ Свободный выход, не подключён</div><div class="row">🔵 Синее волокно неизвестного кабеля; направление не установлено</div><small>Физические номера четырёх портов не подтверждены. Сведения взяты из ранее согласованных записей муфты.</small>'}
const versions=(db.schemes||[]).filter(x=>x.closure_id===c.id).sort((a,b)=>b.version_number-a.version_number);if(versions.length){const v=versions[0].scheme||{};h+='<h4>Сохранённая схема · версия '+e(versions[0].version_number)+'</h4>';if(Array.isArray(v.olt_to_forest)){h+='<b>Сварки OLT → Лес</b>';v.olt_to_forest.forEach(x=>h+='<div class="row"><span style="color:'+fiberColor(x.olt)+'">●</span> '+e(x.olt)+' OLT ↔ <span style="color:'+fiberColor(x.forest)+'">●</span> '+e(x.forest)+' Лес</div>')}if(Array.isArray(v.other_connections)){h+='<b>Прочие соединения</b>';v.other_connections.forEach(x=>h+='<div class="row">'+e(x.olt)+' OLT → '+e(x.destination)+'</div>')}if(v.confirmed_text_splice)h+='<p><b>Текстовая сварка:</b> '+e(v.confirmed_text_splice)+'</p>';if(v.removed_splitter)h+='<p><b>Демонтированный делитель:</b> '+e(v.removed_splitter.current_state)+'</p>';h+='<p><small>Архивная версия может содержать устаревшие пометки. Актуальные дополнения отображаются выше.</small></p>'}
h+='<h4>Сварки ('+splices.length+')</h4>';splices.forEach(x=>{const a=db.cables.find(z=>z.id===x.input_cable_id),b=db.cables.find(z=>z.id===x.output_cable_id);h+='<div class="row">🔗 '+e(a?.code||'Неизвестный кабель')+' №'+e(x.input_fiber)+' ↔ '+e(b?.code||'Неизвестный кабель')+' №'+e(x.output_fiber)+'</div>'});if(!splitters.length&&!splices.length)h+='<p>Подробные соединения пока не внесены.</p>';return h}
function focusClosure(id){const c=db.closures.find(x=>x.id===id);if(c){if(c.latitude&&c.longitude)map.setView([c.latitude,c.longitude],18);show(c)}}
function show(c,tab='scheme'){selectedClosure=c.id;const cables=db.cables.filter(x=>x.from_closure_id===c.id||x.to_closure_id===c.id);let h='<h3>'+e(c.name)+'</h3><small>'+e(c.code)+'</small><div style="display:flex;gap:5px;flex-wrap:wrap;margin:12px 0"><button onclick="switchTab(\'scheme\')">Схема</button><button onclick="switchTab(\'cables\')">Кабели</button><button onclick="switchTab(\'info\')">Информация</button></div>';
if(tab==='scheme')h+=scheme(c);
if(tab==='cables'){h+='<h4>Кабели ('+cables.length+')</h4>';cables.forEach(x=>{const other=db.closures.find(z=>z.id===(x.from_closure_id===c.id?x.to_closure_id:x.from_closure_id));h+='<div class="row"><b>'+e(x.code)+'</b> · '+e(x.fiber_count)+'F<p>'+e(x.notes||'')+'</p>'+(other?'<button data-target="'+e(other.id)+'" class="goto">К муфте: '+e(other.name)+'</button>':'<small>Другая муфта не указана</small>')+'</div>'})}
if(tab==='info')h+='<p>'+e(c.address||'Адрес не указан')+'</p><p>Координаты: '+e(c.latitude)+', '+e(c.longitude)+'</p><p>'+e(c.notes||'Примечаний нет')+'</p><button onclick="focusClosure(selectedClosure)">Показать на карте</button>';
const box=document.getElementById('content');box.innerHTML=h;box.querySelectorAll('.goto').forEach(b=>b.onclick=()=>focusClosure(b.dataset.target));document.getElementById('detail').style.display='block'}
function switchTab(tab){const c=db?.closures.find(x=>x.id===selectedClosure);if(c)show(c,tab)}
function draw(){layer.clearLayers();const index=Object.fromEntries(db.closures.map(x=>[x.id,x]));db.cables.forEach(c=>{const a=index[c.from_closure_id],b=index[c.to_closure_id];if(a?.latitude&&b?.latitude&&(a.latitude!==b.latitude||a.longitude!==b.longitude))L.polyline([[a.latitude,a.longitude],[b.latitude,b.longitude]],{color:'#2563eb',weight:3,opacity:.7}).bindTooltip(e(c.code)+' · '+c.fiber_count+'F').addTo(layer)});const groups={};db.closures.forEach(c=>{if(c.latitude&&c.longitude)(groups[c.latitude+','+c.longitude]??=[]).push(c)});Object.values(groups).forEach(g=>{const c=g[0];L.circleMarker([c.latitude,c.longitude],{radius:g.length>1?10:7,color:'#0f766e',fillOpacity:.9}).addTo(layer).bindTooltip(g.map(x=>e(x.name)).join(' / ')).on('click',()=>{if(g.length===1)show(c);else{const box=document.getElementById('content');box.innerHTML='<h3>Муфты в этой точке</h3>';g.forEach(x=>{const b=document.createElement('button');b.textContent=x.name;b.style.display='block';b.style.margin='8px 0';b.onclick=()=>show(x);box.append(b)});document.getElementById('detail').style.display='block'}})})}
async function load(){const {data}=await sb.auth.getSession();if(!data.session){document.getElementById('login').style.display='block';return}try{const r=await fetch('https://xwnqquregcurkxrbmavy.supabase.co/functions/v1/slavcom-map-data',{headers:{Authorization:'Bearer '+data.session.access_token}});if(!r.ok)throw Error(r.status===403?'Учётная запись ещё не допущена к карте':'Ошибка загрузки: '+r.status);db=await r.json();draw();document.getElementById('login').style.display='none';document.getElementById('status').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')}catch(err){document.getElementById('status').textContent='Нет доступа';msg(err.message);document.getElementById('login').style.display='block'}}
load();setInterval(load,30000);
</script></body></html>
