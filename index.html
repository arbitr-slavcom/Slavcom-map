<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Славком — карта оптической сети</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;font:14px system-ui,sans-serif}header{height:54px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14283c;color:white;box-sizing:border-box}header b{margin-right:auto}button,input{border:1px solid #bac4d0;border-radius:6px;padding:8px;font:inherit}button{cursor:pointer}#map{height:calc(100dvh - 54px)}#login,#detail{position:absolute;z-index:1100;background:#fff;padding:16px;border-radius:10px;box-shadow:0 3px 20px #0004;box-sizing:border-box}#login{top:64px;left:10px;max-width:340px}#login input{display:block;margin:8px 0;width:95%}#detail{top:64px;right:10px;bottom:12px;width:min(390px,94vw);overflow:auto;display:none}#status{font-size:11px}small{color:#64748b}p{overflow-wrap:anywhere}#message{font-size:12px;color:#475569}.row{border-bottom:1px solid #e2e8f0;padding:8px 0}</style></head><body><header><b>Славком · карта</b><span id="status">Вход</span><button onclick="load()">↻</button><button onclick="logout()">Выход</button></header><div id="map"></div><section id="login"><b>Доступ к карте сети</b><p>Введите почту, затем код из письма. Просмотр доступен только разрешённым пользователям.</p><input type="email" id="email" placeholder="Электронная почта"><button onclick="sendCode()">Получить код</button><input id="code" placeholder="Код из письма"><button onclick="verifyCode()">Войти</button><p id="message"></p></section><aside id="detail"><button style="float:right" onclick="document.getElementById('detail').style.display='none'">Закрыть</button><div id="content"></div></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient('https://xwnqquregcurkxrbmavy.supabase.co','sb_publishable_YiKgXPhiGP9CuiMBBBo48Q_NU54IRES');
const map=L.map('map').setView([43.424107,39.954174],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);let db=null;
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=x=>document.getElementById('message').textContent=x;
async function sendCode(){const {error}=await sb.auth.signInWithOtp({email:document.getElementById('email').value.trim()});msg(error?.message||'Код отправлен на почту')}
async function verifyCode(){const {error}=await sb.auth.verifyOtp({email:document.getElementById('email').value.trim(),token:document.getElementById('code').value.trim(),type:'email'});msg(error?.message||'Вход выполнен');if(!error)load()}
async function logout(){await sb.auth.signOut();layer.clearLayers();db=null;document.getElementById('login').style.display='block';document.getElementById('status').textContent='Вход'}
function show(c){const cables=db.cables.filter(x=>x.from_closure_id===c.id||x.to_closure_id===c.id),splitters=db.splitters.filter(x=>x.closure_id===c.id),splices=db.splices.filter(x=>x.closure_id===c.id);let h='<h3>'+e(c.name)+'</h><p>'+e(c.address||'Адрес не указан')+'</p><small>'+e(c.code)+'</small><h4>Кабели ('+cables.length+')</h4>'+cables.map(x=>'<div class="row"><b>'+e(x.code)+'</b> · '+e(x.fiber_count)+'F<br>'+e(x.notes||'')+'</div>').join('');h+='<h4>Делители</h4>'+splitters.map(s=>'<div class="row"><b>'+e(s.code)+'</b> · 1×'+e(s.ratio)+'<p>'+e(s.input_description||'')+'</p><p>'+e(s.notes||'')+'</p>'+db.outputs.filter(o=>o.splitter_id===s.id).map(o=>'<p>↳ '+e(o.fiber_color)+' → '+e((db.cables.find(x=>x.id===o.cable_id)||{}).code)+'</p>').join('')+'</div>').join('');h+='<h4>Сварки ('+splices.length+')</h4>'+splices.map(s=>'<p>'+e((db.cables.find(x=>x.id===s.input_cable_id)||{}).code)+' №'+e(s.input_fiber)+' ↔ '+e((db.cables.find(x=>x.id===s.output_cable_id)||{}).code)+' №'+e(s.output_fiber)+'</p>').join('');if(c.notes)h+='<h4>Примечания</h4><p>'+e(c.notes)+'</p>';document.getElementById('content').innerHTML=h;document.getElementById('detail').style.display='block'}
function draw(){layer.clearLayers();const index=Object.fromEntries(db.closures.map(x=>[x.id,x]));db.cables.forEach(c=>{const a=index[c.from_closure_id],b=index[c.to_closure_id];if(a?.latitude&&b?.latitude&&(a.latitude!==b.latitude||a.longitude!==b.longitude))L.polyline([[a.latitude,a.longitude],[b.latitude,b.longitude]],{color:'#2563eb',weight:3,opacity:.7}).bindTooltip(e(c.code)+' · '+c.fiber_count+'F').addTo(layer)});const groups={};db.closures.forEach(c=>{if(c.latitude&&c.longitude)(groups[c.latitude+','+c.longitude]??=[]).push(c)});Object.values(groups).forEach(g=>{const c=g[0];L.circleMarker([c.latitude,c.longitude],{radius:g.length>1?10:7,color:'#0f766e',fillOpacity:.9}).addTo(layer).bindTooltip(g.map(x=>e(x.name)).join(' / ')).on('click',()=>{if(g.length===1)show(c);else{const box=document.getElementById('content');box.innerHTML='<h3>Муфты в этой точке</h3>';g.forEach(x=>{const b=document.createElement('button');b.textContent=x.name;b.style.display='block';b.style.margin='8px 0';b.onclick=()=>show(x);box.append(b)});document.getElementById('detail').style.display='block'}})})}
async function load(){const {data}=await sb.auth.getSession();if(!data.session){document.getElementById('login').style.display='block';return}try{const r=await fetch('https://xwnqquregcurkxrbmavy.supabase.co/functions/v1/slavcom-map-data',{headers:{Authorization:'Bearer '+data.session.access_token}});if(!r.ok)throw Error(r.status===403?'Учётная запись ещё не допущена к карте':'Ошибка загрузки: '+r.status);db=await r.json();draw();document.getElementById('login').style.display='none';document.getElementById('status').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')}catch(err){document.getElementById('status').textContent='Нет доступа';msg(err.message);document.getElementById('login').style.display='block'}}
load();setInterval(load,30000);
</script></body></html>
